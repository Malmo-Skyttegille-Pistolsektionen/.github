name: Validate Renovate config

on:
  push:
  # No paths filter. This is a required check on the default branch, and a
  # required check that does not run never reports, blocking the pull request
  # forever. The job is a docker pull and a validate -- cheap enough to run on
  # a README-only change rather than make the gate conditional.
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate .github/renovate.json5
        run: |
          # renovate: datasource=docker depName=renovate/renovate
          VERSION="44.70.1"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "renovate/renovate:$VERSION" \
            renovate-config-validator --strict /repo/.github/renovate.json5
